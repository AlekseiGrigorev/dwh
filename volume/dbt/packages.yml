packages:
  - package: elementary-data/elementary
    version: 0.26.1
  # dbt_utils объявлен явно: dbt сверяет число пакетов в packages.yml с числом
  # установленных каталогов в dbt_packages, а elementary тянет dbt_utils
  # транзитивно (в Cosmos dbt работает с копией проекта без package-lock.yml).
  - package: dbt-labs/dbt_utils
    version: 1.4.1
