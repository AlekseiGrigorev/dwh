# Параметры подключения берутся только из окружения контейнера (см. .env.example).
# Секретов в этом файле нет.
dwh:
  target: "postgres"
  outputs:
    postgres: &postgres_output
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: "{{ env_var('DBT_POSTGRES_SCHEMA') }}"
      threads: 4
    clickhouse: &clickhouse_output
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST') }}"
      port: "{{ env_var('CLICKHOUSE_HTTP_PORT') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      schema: "{{ env_var('DBT_CLICKHOUSE_SCHEMA') }}"
      secure: false

# Профиль для внутреннего dbt-проекта Elementary CLI (edr).
# edr запускает собственный проект elementary_cli, у которого profile: elementary.
# Схема — та, в которую dbt-пакет elementary создаёт свои модели:
# <schema проекта>_elementary (из-за models.elementary.+schema: elementary).
elementary:
  target: "postgres"
  outputs:
    postgres:
      <<: *postgres_output
      schema: "{{ env_var('DBT_POSTGRES_SCHEMA') }}_elementary"
    clickhouse:
      <<: *clickhouse_output
      schema: "{{ env_var('DBT_CLICKHOUSE_SCHEMA') }}_elementary"
